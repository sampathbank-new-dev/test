# Nginx site for the CBL frontend  ->  /etc/nginx/sites-available/cbl-frontend
server {
    listen 80;
    listen [::]:80;
    server_name _;    # or your domain, e.g. shop.example.com

    # The React build (contents of the dist/ folder) is copied here.
    root /var/www/cbl-frontend;
    index index.html;

    # The React app. Unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html, so a new deploy shows up immediately.
    location = /index.html {
        expires -1;
    }

    # Vite gives built files unique names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Backend API: the NestJS app on port 3000 (built in the next step).
    # Until it runs, these requests fail and the app shows "Backend not connected".
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
